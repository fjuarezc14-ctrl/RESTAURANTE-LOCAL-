# nginx de producción: sirve el frontend compilado y pasa /api al backend (docker-compose.prod.yml)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Las compras aceptan hasta 2 MB (backend/src/app.js); el resto, 100 KB
    client_max_body_size 5m;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # DNS interno de Docker: vuelve a resolver "backend" si el contenedor se reinicia
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Avisos en vivo (SSE, tarea 16): sin buffer ni compresión y con la conexión abierta
    location /api/eventos {
        set $backend http://backend:3010;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
    }

    location /api {
        set $backend http://backend:3010;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Archivos con hash en el nombre: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # La app (SPA): index.html sin caché para que cada actualización llegue enseguida
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
