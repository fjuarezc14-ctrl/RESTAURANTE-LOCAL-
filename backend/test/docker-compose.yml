# Postgres solo para pruebas: datos en memoria, se borran al apagarlo.
# Uso: npm run test:db  (y luego npm test)
name: restaurante-test

services:
  db:
    image: postgres:16-alpine
    ports:
      - "${TEST_DB_PORT:-5446}:5432"
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=restaurante_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test -d restaurante_test" ]
      interval: 2s
      timeout: 3s
      retries: 15
