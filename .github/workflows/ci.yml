name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  pruebas-backend:
    name: Pruebas del backend
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: restaurante_test
        ports:
          - 5446:5432
        options: >-
          --health-cmd "pg_isready -U test -d restaurante_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL_TEST: postgresql://test:test@localhost:5446/restaurante_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npm test
